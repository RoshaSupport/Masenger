<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#111">
    <meta name="description"
          content="Rosha Support - ارتباط مستقیم">

    <title>Rosha Support</title>

    <style>
        /* =========================================================
           ROSHA SUPPORT
           ALL CSS IS INSIDE THIS FILE
        ========================================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            min-height: 100svh;
            height: 100dvh;

            font-family:
                Tahoma,
                Arial,
                "Segoe UI",
                sans-serif;

            color: #ffffff;

            background:
                url("./background.png")
                center center
                / cover
                no-repeat;

            background-color: #111;

            position: relative;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* ظریف‌ترین لایه برای افزایش خوانایی */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.18) 0%,
                    rgba(0, 0, 0, 0.08) 45%,
                    rgba(0, 0, 0, 0.24) 100%
                );

            pointer-events: none;
            z-index: 0;
        }

        /* =========================================================
           MAIN CONTAINER
        ========================================================= */

        .page {
            position: relative;
            z-index: 1;

            width: 100%;
            height: 100dvh;
            min-height: 100svh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding:
                max(24px, env(safe-area-inset-top))
                20px
                max(20px, env(safe-area-inset-bottom))
                20px;

            overflow: hidden;
        }

        /* =========================================================
           BRAND
        ========================================================= */

        .brand {
            margin-top: clamp(5px, 2vh, 20px);

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            user-select: none;
        }

        .brand-name {
            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            font-size: clamp(20px, 5vw, 28px);
            font-weight: 500;
            letter-spacing: 0.8px;

            color: rgba(255, 255, 255, 0.96);

            text-shadow:
                0 2px 18px rgba(0, 0, 0, 0.28);
        }

        .brand-line {
            width: 30px;
            height: 1px;

            margin-top: 7px;

            background: rgba(255, 255, 255, 0.55);

            border-radius: 50%;
        }

        /* =========================================================
           CENTER CONTENT
        ========================================================= */

        .content {
            width: 100%;
            max-width: 430px;

            flex: 1;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding-bottom: clamp(5px, 2vh, 20px);
        }

        .headline {
            margin: 0;

            font-size: clamp(17px, 4.6vw, 23px);
            line-height: 1.75;

            font-weight: 500;

            color: rgba(255, 255, 255, 0.97);

            text-shadow:
                0 2px 15px rgba(0, 0, 0, 0.4);
        }

        .subheadline {
            margin: 7px 0 0;

            font-size: clamp(11px, 3vw, 14px);
            line-height: 1.7;

            font-weight: 400;

            color: rgba(255, 255, 255, 0.72);

            text-shadow:
                0 1px 10px rgba(0, 0, 0, 0.35);
        }

        /* =========================================================
           CONTACT OPTIONS
        ========================================================= */

        .contact-list {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: clamp(12px, 3.5vh, 20px);

            margin-top: clamp(24px, 5vh, 38px);
        }

        .contact-row {
            width: 100%;

            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;

            direction: ltr;

            gap: 8px;
        }

        /* =========================================================
           ICON
           این قسمت مستقل از دکمه است و هنگام Press ثابت می‌ماند.
        ========================================================= */

        .contact-icon {
            flex: 0 0 auto;

            width: clamp(50px, 13vw, 60px);
            height: clamp(50px, 13vw, 60px);

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background: rgba(255, 255, 255, 0.13);

            border: 1px solid rgba(255, 255, 255, 0.28);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.20);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            overflow: hidden;

            position: relative;

            transition:
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .contact-icon::after {
            content: "";

            position: absolute;
            top: 1px;
            left: 12%;
            right: 12%;

            height: 35%;

            border-radius: 50%;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.22),
                    rgba(255,255,255,0)
                );

            pointer-events: none;
        }

        .contact-icon svg {
            width: 58%;
            height: 58%;

            position: relative;
            z-index: 1;

            display: block;
        }

        /* =========================================================
           BUTTON
        ========================================================= */

        .contact-button {
            position: relative;

            flex: 1 1 auto;

            min-width: 0;

            height: clamp(50px, 13vw, 60px);

            padding:
                0 clamp(15px, 4vw, 22px);

            border-radius: 17px;

            border: 1px solid rgba(255, 255, 255, 0.27);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.19),
                    rgba(255, 255, 255, 0.07)
                );

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                inset 0 -1px 0 rgba(0, 0, 0, 0.10);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            color: #fff;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            font-size: clamp(12px, 3.4vw, 15px);
            font-weight: 500;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            white-space: nowrap;

            text-decoration: none;

            overflow: hidden;

            transform: translateY(0);

            transition:
                transform 0.11s ease,
                box-shadow 0.11s ease,
                background 0.11s ease;
        }

        .contact-button::before {
            content: "";

            position: absolute;

            top: 0;
            left: 8%;
            right: 8%;

            height: 45%;

            border-radius: 50%;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.15),
                    rgba(255,255,255,0)
                );

            pointer-events: none;
        }

        .contact-button span {
            position: relative;
            z-index: 1;

            text-shadow:
                0 1px 8px rgba(0,0,0,0.25);
        }

        /* Press فقط روی دکمه */
        .contact-button:active {
            transform: translateY(2px) scale(0.992);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.13),
                    rgba(255,255,255,0.05)
                );

            box-shadow:
                0 5px 14px rgba(0,0,0,0.22),
                inset 0 1px 0 rgba(255,255,255,0.14);
        }

        /* =========================================================
           BRAND COLORS
        ========================================================= */

        .whatsapp-icon {
            background:
                linear-gradient(
                    145deg,
                    rgba(37, 211, 102, 0.34),
                    rgba(37, 211, 102, 0.12)
                );
        }

        .eitaa-icon {
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 126, 38, 0.34),
                    rgba(255, 126, 38, 0.12)
                );
        }

        .whatsapp-button {
            border-color: rgba(37, 211, 102, 0.34);
        }

        .eitaa-button {
            border-color: rgba(255, 126, 38, 0.34);
        }

        /* =========================================================
           SMALL FOOTER TEXT
        ========================================================= */

        .bottom-note {
            flex: 0 0 auto;

            margin-bottom: clamp(2px, 1vh, 10px);

            font-size: 9px;

            color: rgba(255,255,255,0.42);

            letter-spacing: 0.2px;

            text-align: center;

            user-select: none;
        }

        /* =========================================================
           RESPONSIVE - VERY SMALL PHONES
        ========================================================= */

        @media (max-height: 620px) {

            .brand {
                margin-top: 0;
            }

            .brand-name {
                font-size: 19px;
            }

            .headline {
                font-size: 16px;
            }

            .subheadline {
                margin-top: 4px;
                font-size: 10px;
            }

            .contact-list {
                margin-top: 18px;
                gap: 10px;
            }

            .contact-icon,
            .contact-button {
                height: 48px;
            }

            .contact-icon {
                width: 48px;
                border-radius: 14px;
            }

            .contact-button {
                border-radius: 14px;
            }
        }

        /* =========================================================
           LANDSCAPE
        ========================================================= */

        @media (orientation: landscape) and (max-height: 520px) {

            .page {
                padding-top:
                    max(10px, env(safe-area-inset-top));

                padding-bottom:
                    max(8px, env(safe-area-inset-bottom));
            }

            .brand-name {
                font-size: 18px;
            }

            .content {
                padding: 0;
            }

            .headline {
                font-size: 15px;
            }

            .subheadline {
                font-size: 10px;
                margin-top: 2px;
            }

            .contact-list {
                flex-direction: row;
                justify-content: center;
                gap: 10px;

                margin-top: 12px;
            }

            .contact-row {
                width: 48%;
            }

            .contact-icon {
                width: 45px;
                height: 45px;
            }

            .contact-button {
                height: 45px;
                font-size: 11px;
            }

            .bottom-note {
                display: none;
            }
        }

        /* =========================================================
           ACCESSIBILITY
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .contact-button {
                transition: none;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- =========================================================
         BRAND
    ========================================================== -->

    <header class="brand">
        <div class="brand-name">Rosha Support</div>
        <div class="brand-line"></div>
    </header>


    <!-- =========================================================
         MAIN CONTENT
    ========================================================== -->

    <main class="content">

        <h1 class="headline">
            برای آغاز گفتگو، پیام‌رسان موردنظر خود را انتخاب کنید.
        </h1>

        <p class="subheadline">
            ارتباط مستقیم از طریق پیام‌رسان انتخابی شما
        </p>


        <!-- =====================================================
             CONTACT BUTTONS
        ====================================================== -->

        <div class="contact-list">

            <!-- ================= WHATSAPP ================= -->

            <div class="contact-row">

                <!-- آیکون مستقل است و هنگام Press حرکت نمی‌کند -->
                <div class="contact-icon whatsapp-icon"
                     aria-hidden="true">

                    <svg viewBox="0 0 32 32"
                         xmlns="http://www.w3.org/2000/svg">

                        <path
                            fill="#25D366"
                            d="M16 3.2C9.1 3.2 3.5 8.8 3.5 15.7c0 2.2.6 4.3 1.7 6.1L3.3 28.7l7.1-1.9c1.7.9 3.6 1.4 5.6 1.4h.1c6.9 0 12.4-5.6 12.4-12.5C28.5 8.8 22.9 3.2 16 3.2z"/>

                        <path
                            fill="#fff"
                            d="M22.9 18.5c-.4-.2-2.4-1.2-2.8-1.3-.4-.2-.6-.2-.9.2-.3.4-1 1.3-1.2 1.6-.2.3-.5.3-.9.1-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.6.2-.8.2-.2.4-.5.6-.7.2-.2.3-.4.4-.6.1-.3 0-.5 0-.7-.1-.2-.9-2.1-1.2-2.9-.3-.7-.6-.6-.9-.6h-.7c-.3 0-.7.1-1 .5-.3.4-1.3 1.3-1.3 3.2s1.3 3.7 1.5 4c.2.3 2.5 3.9 6 5.3.8.3 1.5.5 2 .6.8.2 1.6.2 2.2.1.7-.1 2.4-1 2.7-2 .3-1 .3-1.8.2-2-.1-.2-.4-.3-.8-.5z"/>

                    </svg>

                </div>


                <!-- دکمه -->
                <a
                    id="whatsappButton"
                    class="contact-button whatsapp-button"
                    href="#"
                    aria-label="شروع گفتگو در واتساپ">

                    <span>شروع گفتگو در واتساپ</span>

                </a>

            </div>


            <!-- ================= EITAA ================= -->

            <div class="contact-row">

                <!-- آیکون مستقل است و هنگام Press حرکت نمی‌کند -->
                <div class="contact-icon eitaa-icon"
                     aria-hidden="true">

                    <svg viewBox="0 0 32 32"
                         xmlns="http://www.w3.org/2000/svg">

                        <circle
                            cx="16"
                            cy="16"
                            r="13"
                            fill="#FF7E26"/>

                        <path
                            fill="#fff"
                            d="M22.2 10.7c-.5-.5-1.3-.7-2.1-.5l-10 3.1c-.8.2-1.3.8-1.3 1.6 0 .7.5 1.4 1.2 1.6l3.3 1 1.2 3.6c.2.6.7 1 1.3 1 .4 0 .8-.2 1.1-.5l1.7-1.8 2.8 1.1c.8.3 1.5.2 2.1-.3.6-.5.8-1.2.7-2l-.8-7c-.1-.4-.4-.8-.8-.9z"/>

                        <path
                            fill="#FF7E26"
                            d="M12.4 15.5l6.6-2.1-4.7 3.3-.7 2.1-.7-2.3-1.9-.6z"/>

                    </svg>

                </div>


                <!-- دکمه -->
                <a
                    id="eitaaButton"
                    class="contact-button eitaa-button"
                    href="#"
                    aria-label="شروع گفتگو در ایتا">

                    <span>شروع گفتگو در ایتا</span>

                </a>

            </div>

        </div>

    </main>


    <div class="bottom-note">
        Rosha Support
    </div>

</div>


<script>

    /* =============================================================
       =============================================================
       
          █████████████████████████████████████████████████████
          
                    ROSHA SUPPORT SETTINGS
          
          این قسمت برای تغییر اطلاعات تماس است.
          
          اگر بعداً خواستی شماره واتساپ یا آیدی ایتا را تغییر بدهی،
          فقط مقادیر همین بخش را تغییر بده.
          
          به هیچ قسمت دیگری از کد نیاز نیست دست بزنی.
          
       =============================================================
       ============================================================= */

    const ROSHA_SETTINGS = {

        /*
         * شماره واتساپ
         *
         * شماره را بدون + و بدون فاصله وارد کن.
         *
         * مثال:
         * 989304047332
         */

        whatsappNumber: "989304047332",


        /*
         * آیدی ایتا
         *
         * فقط خود آیدی را وارد کن.
         * @ لازم نیست.
         */

        eitaaUsername: "RoshaSupportt",


        /*
         * پیام آماده واتساپ
         *
         * هر متنی که اینجا بنویسی،
         * هنگام باز شدن واتساپ به عنوان پیام آماده قرار می‌گیرد.
         */

        whatsappMessage: "سلام، برای دریافت اطلاعات بیشتر پیام دادم."
    };


    /* =============================================================
       ساخت لینک واتساپ
    ============================================================= */

    const whatsappLink =
        "https://wa.me/" +
        ROSHA_SETTINGS.whatsappNumber +
        "?text=" +
        encodeURIComponent(
            ROSHA_SETTINGS.whatsappMessage
        );


    /* =============================================================
       ساخت لینک ایتا
    ============================================================= */

    const eitaaLink =
        "https://eitaa.com/" +
        ROSHA_SETTINGS.eitaaUsername;


    /* =============================================================
       اتصال لینک‌ها به دکمه‌ها
    ============================================================= */

    const whatsappButton =
        document.getElementById("whatsappButton");

    const eitaaButton =
        document.getElementById("eitaaButton");


    whatsappButton.href = whatsappLink;

    eitaaButton.href = eitaaLink;


    /* =============================================================
       UI CLICK SOUND
       
       بدون فایل صوتی خارجی
       استفاده از Web Audio API
    ============================================================= */

    let audioContext = null;


    function playClickSound() {

        try {

            if (!audioContext) {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if (!AudioContext) {
                    return;
                }

                audioContext = new AudioContext();
            }


            if (audioContext.state === "suspended") {
                audioContext.resume();
            }


            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            oscillator.type = "sine";

            oscillator.frequency.setValueAtTime(
                620,
                audioContext.currentTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                420,
                audioContext.currentTime + 0.045
            );


            gain.gain.setValueAtTime(
                0.0001,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.035,
                audioContext.currentTime + 0.006
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                audioContext.currentTime + 0.055
            );


            oscillator.connect(gain);
            gain.connect(audioContext.destination);


            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + 0.06
            );

        } catch (error) {

            /*
             * اگر مرورگر اجازه پخش صدا نداد،
             * هیچ اتفاقی برای لینک نمی‌افتد.
             */

        }
    }


    /* =============================================================
       TOUCH / CLICK
       
       صدا قبل از انتقال به پیام‌رسان اجرا می‌شود.
    ============================================================= */

    whatsappButton.addEventListener(
        "pointerdown",
        playClickSound,
        { passive: true }
    );


    eitaaButton.addEventListener(
        "pointerdown",
        playClickSound,
        { passive: true }
    );


    /* =============================================================
       جلوگیری از رفتارهای ناخواسته
    ============================================================= */

    document.addEventListener(
        "touchmove",
        function(event) {
            event.preventDefault();
        },
        { passive: false }
    );

</script>

</body>
</html>
