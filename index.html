<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#111111">

    <title>ارتباط مستقیم</title>


    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            font-family:
                Tahoma,
                Arial,
                "Segoe UI",
                sans-serif;
        }


        body {

            background: #111;

            color: #fff;

            touch-action: manipulation;

            overscroll-behavior-y: auto;
        }


        /* =========================================================
           MAIN PAGE
        ========================================================= */

        .page {

            position: relative;

            width: 100%;

            height: 100vh;
            height: 100svh;
            height: 100dvh;

            overflow: hidden;

            background-image:
                linear-gradient(
                    rgba(0,0,0,0.025),
                    rgba(0,0,0,0.025)
                ),
                url("./background.png");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;
        }


        /* =========================================================
           TOP INSTRUCTION
        ========================================================= */

        .instruction {

            position: absolute;

            z-index: 20;

            top: 10.5%;

            left: 50%;

            transform: translateX(-50%);

            width: 94%;

            text-align: center;

            white-space: nowrap;

            color: #111;

            font-size:
                clamp(
                    18px,
                    5vw,
                    27px
                );

            font-weight: 800;

            line-height: 1.4;

            text-shadow:
                0 1px 1px rgba(255,255,255,0.85),
                0 2px 5px rgba(0,0,0,0.10);

            pointer-events: none;
        }


        /* =========================================================
           CONTACT BUTTON AREA
           
           The buttons sit in the upper quarter of the image,
           ABOVE the "برخط" and "آنلاین" text already present
           inside background.png.
        ========================================================= */

        .contact-area {

            position: absolute;

            z-index: 30;

            top: 20.5%;

            left: 0;

            width: 100%;

            display: flex;

            flex-direction: row;

            justify-content: space-between;

            align-items: flex-start;

            direction: ltr;

            padding-left: 11.2%;
            padding-right: 11.2%;

            pointer-events: none;
        }


        /* =========================================================
           CONTACT BUTTON BASE
        ========================================================= */

        .contact-button {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            width: 37.8vw;

            max-width: 176px;

            min-width: 0;

            /*
             * Height is deliberately matched to the door proportions.
             */
            height: 72px;

            border-radius: 15px;

            border: 1px solid
                rgba(255,255,255,0.70);

            text-decoration: none;

            overflow: hidden;

            cursor: pointer;

            pointer-events: auto;

            user-select: none;

            -webkit-user-select: none;

            -webkit-user-drag: none;

            transform:
                translate3d(0,0,0);

            transition:
                transform 85ms cubic-bezier(.2,.8,.3,1),
                box-shadow 85ms ease,
                filter 85ms ease;

            /*
             * Strong glass / depth effect.
             */

            backdrop-filter:
                blur(13px)
                saturate(145%);

            -webkit-backdrop-filter:
                blur(13px)
                saturate(145%);
        }


        /* =========================================================
           GLASS REFLECTION
        ========================================================= */

        .contact-button::before {

            content: "";

            position: absolute;

            inset: 1px;

            border-radius: 14px;

            pointer-events: none;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.48) 0%,
                    rgba(255,255,255,0.15) 28%,
                    rgba(255,255,255,0.025) 58%,
                    rgba(0,0,0,0.13) 100%
                );
        }


        .contact-button::after {

            content: "";

            position: absolute;

            top: 0;

            left: 10%;

            width: 80%;

            height: 2px;

            border-radius: 100%;

            background:
                rgba(255,255,255,0.75);

            box-shadow:
                0 1px 4px rgba(255,255,255,0.35);

            pointer-events: none;
        }


        /* =========================================================
           WHATSAPP BUTTON
        ========================================================= */

        .whatsapp {

            background:
                linear-gradient(
                    145deg,
                    rgba(52,232,124,0.94),
                    rgba(37,211,102,0.94) 48%,
                    rgba(18,166,82,0.95)
                );

            box-shadow:

                0 15px 25px
                rgba(0,0,0,0.34),

                0 7px 10px
                rgba(0,0,0,0.23),

                inset 0 3px 3px
                rgba(255,255,255,0.55),

                inset 0 -7px 10px
                rgba(0,0,0,0.18);
        }


        /* =========================================================
           EITAA BUTTON
        ========================================================= */

        .eitaa {

            background:
                linear-gradient(
                    145deg,
                    rgba(255,171,75,0.96),
                    rgba(245,130,32,0.96) 48%,
                    rgba(211,91,9,0.97)
                );

            box-shadow:

                0 15px 25px
                rgba(0,0,0,0.34),

                0 7px 10px
                rgba(0,0,0,0.23),

                inset 0 3px 3px
                rgba(255,255,255,0.55),

                inset 0 -7px 10px
                rgba(0,0,0,0.18);
        }


        /* =========================================================
           BUTTON TEXT
        ========================================================= */

        .button-name {

            position: relative;

            z-index: 5;

            color: #fff;

            font-size:
                clamp(
                    22px,
                    6vw,
                    31px
                );

            font-weight: 900;

            line-height: 1;

            text-shadow:

                0 2px 2px
                rgba(0,0,0,0.30),

                0 3px 6px
                rgba(0,0,0,0.24);

            letter-spacing: 0;
        }


        /* =========================================================
           PRESS EFFECT
           
           Only the button moves.
           Background remains completely still.
        ========================================================= */

        .contact-button:active {

            transform:
                translate3d(0,5px,0)
                scale(0.985);

            filter:
                brightness(0.93);

            box-shadow:

                0 4px 7px
                rgba(0,0,0,0.30),

                0 2px 3px
                rgba(0,0,0,0.18),

                inset 0 6px 10px
                rgba(0,0,0,0.23),

                inset 0 -1px 2px
                rgba(255,255,255,0.18);
        }


        /* =========================================================
           SMALL HEIGHT PHONES
        ========================================================= */

        @media (max-height: 700px) {

            .instruction {

                top: 9%;

                font-size: 18px;
            }


            .contact-area {

                top: 19%;
            }


            .contact-button {

                height: 65px;
            }


            .button-name {

                font-size: 21px;
            }
        }


        /* =========================================================
           VERY NARROW PHONES
        ========================================================= */

        @media (max-width: 340px) {

            .contact-area {

                padding-left: 9%;
                padding-right: 9%;
            }


            .contact-button {

                width: 39vw;

                height: 64px;
            }


            .button-name {

                font-size: 20px;
            }


            .instruction {

                font-size: 17px;
            }
        }


        /* =========================================================
           LANDSCAPE
        ========================================================= */

        @media (orientation: landscape) {

            .instruction {

                top: 6%;

                font-size: 19px;
            }


            .contact-area {

                top: 16%;
            }


            .contact-button {

                height: 60px;
            }
        }

    </style>

</head>


<body>


    <main class="page">


        <!-- =====================================================
             ONLY TEXT ABOVE THE BUTTONS
        ====================================================== -->

        <div class="instruction">
            برای ارتباط مستقیم، یکی را انتخاب کنید
        </div>


        <!-- =====================================================
             TWO CONTACT BUTTONS
             
             LEFT  = EITAA
             RIGHT = WHATSAPP
        ====================================================== -->

        <section
            class="contact-area"
            aria-label="انتخاب پیام‌رسان"
        >


            <!-- EITAA -->

            <a
                id="eitaaButton"
                class="contact-button eitaa"
                href="#"
                aria-label="ایتا"
                rel="noopener"
            >

                <span class="button-name">
                    ایتا
                </span>

            </a>


            <!-- WHATSAPP -->

            <a
                id="whatsappButton"
                class="contact-button whatsapp"
                href="#"
                aria-label="واتساپ"
                rel="noopener"
            >

                <span class="button-name">
                    واتساپ
                </span>

            </a>


        </section>


    </main>



    <script>


        /* =========================================================
           =========================================================
           CONTACT SETTINGS
           
           این تنها بخشی است که بعداً برای تغییر مقصدها لازم است
           ویرایش کنی.
           
           =========================================================
        */


        const CONTACT_SETTINGS = {


            /* =====================================================
               WHATSAPP NUMBER
               
               فقط شماره را تغییر بده.
               
               بدون +
               بدون فاصله
               بدون خط تیره
               
               مثال:
               989301234567
            ===================================================== */

            whatsappNumber:
                "989304047332",


            /* =====================================================
               WHATSAPP READY MESSAGE
            ===================================================== */

            whatsappMessage:
                "سلام، برای ارتباط با Rosha Support پیام دادم.",


            /* =====================================================
               EITAA USERNAME
               
               بدون @
            ===================================================== */

            eitaaUsername:
                "RoshaSupportt"

        };


        /* =========================================================
           WHATSAPP LINK
        ========================================================= */

        const whatsappButton =
            document.getElementById(
                "whatsappButton"
            );


        whatsappButton.href =
            "https://wa.me/" +
            CONTACT_SETTINGS.whatsappNumber +
            "?text=" +
            encodeURIComponent(
                CONTACT_SETTINGS.whatsappMessage
            );


        /* =========================================================
           EITAA LINK
        ========================================================= */

        const eitaaButton =
            document.getElementById(
                "eitaaButton"
            );


        eitaaButton.href =
            "https://eitaa.com/" +
            CONTACT_SETTINGS.eitaaUsername;



        /* =========================================================
           AUDIO ENGINE
           
           Two different bell sounds:
           
           WhatsApp:
           cleaner / brighter / modern
           
           Eitaa:
           slightly older / traditional bell feeling
        ========================================================= */

        let audioContext = null;


        function getAudioContext() {

            try {

                if (!audioContext) {

                    const AudioContext =
                        window.AudioContext ||
                        window.webkitAudioContext;

                    if (!AudioContext) {
                        return null;
                    }

                    audioContext =
                        new AudioContext();
                }


                if (
                    audioContext.state ===
                    "suspended"
                ) {

                    audioContext.resume();
                }


                return audioContext;

            } catch (error) {

                return null;
            }
        }



        /* =========================================================
           WHATSAPP BELL
           
           Short, clean two-tone digital doorbell.
        ========================================================= */

        function playWhatsAppBell() {

            const ctx =
                getAudioContext();

            if (!ctx) {
                return;
            }


            const now =
                ctx.currentTime;


            const master =
                ctx.createGain();


            master.gain.setValueAtTime(
                0.0001,
                now
            );


            master.gain.exponentialRampToValueAtTime(
                0.17,
                now + 0.008
            );


            master.gain.exponentialRampToValueAtTime(
                0.0001,
                now + 0.38
            );


            master.connect(
                ctx.destination
            );


            const osc1 =
                ctx.createOscillator();


            const osc2 =
                ctx.createOscillator();


            osc1.type = "sine";
            osc2.type = "sine";


            osc1.frequency.setValueAtTime(
                880,
                now
            );


            osc2.frequency.setValueAtTime(
                660,
                now + 0.11
            );


            osc1.connect(master);
            osc2.connect(master);


            osc1.start(now);

            osc2.start(
                now + 0.11
            );


            osc1.stop(
                now + 0.18
            );


            osc2.stop(
                now + 0.38
            );
        }



        /* =========================================================
           EITAA BELL
           
           Slightly warmer and older sounding.
           Two resonant tones with a longer decay.
        ========================================================= */

        function playEitaaBell() {

            const ctx =
                getAudioContext();

            if (!ctx) {
                return;
            }


            const now =
                ctx.currentTime;


            const master =
                ctx.createGain();


            master.gain.setValueAtTime(
                0.0001,
                now
            );


            master.gain.exponentialRampToValueAtTime(
                0.20,
                now + 0.012
            );


            master.gain.exponentialRampToValueAtTime(
                0.0001,
                now + 0.55
            );


            master.connect(
                ctx.destination
            );


            const osc1 =
                ctx.createOscillator();


            const osc2 =
                ctx.createOscillator();


            const osc3 =
                ctx.createOscillator();


            osc1.type = "triangle";
            osc2.type = "sine";
            osc3.type = "sine";


            osc1.frequency.setValueAtTime(
                590,
                now
            );


            osc2.frequency.setValueAtTime(
                470,
                now + 0.13
            );


            osc3.frequency.setValueAtTime(
                350,
                now + 0.18
            );


            osc1.connect(master);
            osc2.connect(master);
            osc3.connect(master);


            osc1.start(now);

            osc2.start(
                now + 0.13
            );

            osc3.start(
                now + 0.18
            );


            osc1.stop(
                now + 0.22
            );

            osc2.stop(
                now + 0.42
            );

            osc3.stop(
                now + 0.55
            );
        }



        /* =========================================================
           TOUCH EVENTS
        ========================================================= */

        whatsappButton.addEventListener(
            "pointerdown",
            function () {

                playWhatsAppBell();

            },
            {
                passive: true
            }
        );


        eitaaButton.addEventListener(
            "pointerdown",
            function () {

                playEitaaBell();

            },
            {
                passive: true
            }
        );


    </script>


</body>

</html>
