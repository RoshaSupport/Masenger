<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#d9c9ae">

<title>Rosha Support</title>

<style>

/* =========================================================
   ROSHA SUPPORT
   VERSION: INTERACTIVE DOORS
   فقط همین فایل برای اجرای سایت کافی است.
========================================================= */


/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;

    overflow: hidden;

    margin: 0;
    padding: 0;
}

body {
    min-height: 100svh;
    height: 100dvh;

    font-family:
        Tahoma,
        Arial,
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #d8c9ae 0%,
            #c8b89a 55%,
            #9e8a6d 100%
        );

    color: #111;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;

    touch-action: manipulation;
}


/* =========================
   PAGE
========================= */

.page {
    position: relative;

    width: 100%;
    height: 100dvh;
    min-height: 100svh;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding:
        max(18px, env(safe-area-inset-top))
        14px
        max(10px, env(safe-area-inset-bottom))
        14px;
}


/* =========================
   TOP TITLE
========================= */

.brand {
    position: relative;
    z-index: 20;

    flex: 0 0 auto;

    margin-top: 3px;

    text-align: center;
}

.brand-name {
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    font-size: clamp(21px, 6vw, 29px);

    font-weight: 600;

    letter-spacing: .4px;

    color: #111;

    text-shadow:
        0 1px 0 rgba(255,255,255,.65);
}


/* =========================
   HEADLINE
========================= */

.headline {
    position: relative;
    z-index: 20;

    flex: 0 0 auto;

    margin-top:
        clamp(12px, 3vh, 25px);

    padding: 0 5px;

    text-align: center;

    font-size:
        clamp(
            18px,
            5vw,
            25px
        );

    line-height: 1.7;

    font-weight: 700;

    color: #111;

    text-shadow:
        0 1px 0 rgba(255,255,255,.7);
}


/* =========================================================
   SCENE
========================================================= */

.scene {
    position: relative;

    width: 100%;

    max-width: 520px;

    flex: 1 1 auto;

    min-height: 0;

    margin-top:
        clamp(
            8px,
            2vh,
            18px
        );

    overflow: hidden;

    border-radius: 26px;

    /*
       ظاهر کلی یک محیط واقعی
    */

    background:
        linear-gradient(
            180deg,
            #a9c6d5 0%,
            #c8d6c3 46%,
            #81935d 47%,
            #56643e 100%
        );

    box-shadow:
        0 18px 45px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.4);

    border:
        1px solid rgba(255,255,255,.45);
}


/* =========================================================
   SKY
========================================================= */

.sky {
    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            ellipse at 50% 10%,
            rgba(255,248,214,.9),
            rgba(255,248,214,0) 32%
        );

    pointer-events: none;
}


/* =========================================================
   CLOUDS
========================================================= */

.cloud {
    position: absolute;

    width: 90px;
    height: 24px;

    background:
        rgba(255,255,255,.55);

    border-radius: 50px;

    filter: blur(1px);

    opacity: .65;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    background:
        inherit;

    border-radius: 50%;
}

.cloud::before {
    width: 42px;
    height: 42px;

    left: 15px;
    top: -17px;
}

.cloud::after {
    width: 50px;
    height: 50px;

    right: 12px;
    top: -25px;
}

.cloud.one {
    top: 11%;
    left: 8%;
    transform: scale(.7);
}

.cloud.two {
    top: 18%;
    right: 3%;
    transform: scale(.55);
}


/* =========================================================
   DISTANT HILLS
========================================================= */

.hill {
    position: absolute;

    left: -10%;
    right: -10%;

    bottom: 28%;

    height: 35%;

    background:
        #71835a;

    border-radius:
        50% 50% 0 0 /
        40% 40% 0 0;

    opacity: .9;
}

.hill.back {
    bottom: 33%;
    height: 27%;

    background:
        #899875;

    transform:
        translateX(-8%);
}


/* =========================================================
   GROUND
========================================================= */

.ground {
    position: absolute;

    left: -5%;
    right: -5%;

    bottom: 0;

    height: 42%;

    background:
        linear-gradient(
            180deg,
            #788854,
            #52603c 55%,
            #414a31
        );

    clip-path:
        polygon(
            0 20%,
            100% 0,
            100% 100%,
            0 100%
        );
}


/* =========================================================
   PATH
========================================================= */

.path {
    position: absolute;

    left: 50%;

    bottom: -5%;

    transform:
        translateX(-50%);

    width: 34%;

    height: 48%;

    background:
        linear-gradient(
            90deg,
            #9c8767,
            #c3a77d,
            #9c8767
        );

    clip-path:
        polygon(
            38% 0,
            62% 0,
            100% 100%,
            0 100%
        );

    opacity: .9;
}


/* =========================================================
   TREES / GARDEN
========================================================= */

.tree {
    position: absolute;

    bottom: 22%;

    width: 16px;
    height: 90px;

    background:
        #59452e;

    border-radius: 8px;
}

.tree::before {
    content: "";

    position: absolute;

    width: 80px;
    height: 80px;

    left: 50%;
    top: -48px;

    transform:
        translateX(-50%);

    background:
        radial-gradient(
            circle,
            #66824a 0 55%,
            transparent 56%
        );

    filter:
        drop-shadow(
            0 4px 5px
            rgba(0,0,0,.18)
        );
}

.tree.t1 {
    left: 5%;
    transform: scale(.75);
}

.tree.t2 {
    right: 7%;
    transform: scale(.95);
}

.tree.t3 {
    left: 24%;
    transform: scale(.52);
}

.tree.t4 {
    right: 26%;
    transform: scale(.6);
}


/* =========================================================
   GARDEN FLOWERS
========================================================= */

.flower {
    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #f5e5a8;

    box-shadow:
        0 0 0 3px rgba(255,255,255,.18);
}

.flower.f1 {
    left: 15%;
    bottom: 18%;
}

.flower.f2 {
    left: 27%;
    bottom: 14%;
}

.flower.f3 {
    right: 17%;
    bottom: 20%;
}

.flower.f4 {
    right: 31%;
    bottom: 12%;
}


/* =========================================================
   DOORS AREA
========================================================= */

.doors {
    position: absolute;

    z-index: 10;

    left: 50%;

    bottom: 9%;

    transform:
        translateX(-50%);

    width: 94%;

    height: 67%;

    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    direction: ltr;
}


/* =========================================================
   DOOR UNIT
========================================================= */

.door-unit {

    position: relative;

    width: 47%;

    height: 100%;

    perspective: 1200px;

    display: flex;

    align-items: flex-end;

    justify-content: center;
}


/* =========================================================
   DOOR FRAME
========================================================= */

.door-frame {

    position: relative;

    width: 100%;

    height: 88%;

    background:
        linear-gradient(
            90deg,
            #4a3424,
            #755337 15%,
            #5d412c 50%,
            #3d291c 100%
        );

    border-radius:
        8px 8px 2px 2px;

    padding:
        7px;

    box-shadow:
        0 14px 22px rgba(0,0,0,.34),
        inset 0 0 0 2px
        rgba(255,255,255,.14);
}


/* =========================================================
   DOOR
========================================================= */

.door {

    position: relative;

    width: 100%;

    height: 100%;

    transform-origin: left center;

    transform:
        rotateY(0deg);

    transition:
        transform .85s
        cubic-bezier(.22,.75,.18,1);

    transform-style: preserve-3d;

    cursor: pointer;

    border-radius:
        5px;

    overflow: hidden;

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,.15),
        7px 10px 15px
        rgba(0,0,0,.25);
}


/* =========================================================
   DOOR WOOD
========================================================= */

.door-surface {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            #704b2d,
            #95683f 18%,
            #714b2e 36%,
            #9b6c42 54%,
            #6c472a 76%,
            #825936 100%
        );

    box-shadow:
        inset 0 0 25px
        rgba(0,0,0,.24);

    backface-visibility: hidden;
}


/* =========================================================
   WOOD PANELS
========================================================= */

.panel {
    position: absolute;

    left: 12%;
    right: 12%;

    height: 25%;

    border:
        2px solid
        rgba(50,30,16,.48);

    border-radius: 3px;

    box-shadow:
        inset 0 2px 5px
        rgba(255,255,255,.08),
        0 2px 4px
        rgba(0,0,0,.15);
}

.panel.p1 {
    top: 10%;
}

.panel.p2 {
    top: 38%;
}

.panel.p3 {
    top: 66%;
}


/* =========================================================
   DOOR TEXT
========================================================= */

.door-sign {

    position: absolute;

    left: 7%;
    right: 7%;

    top: 18%;

    z-index: 5;

    text-align: center;

    color: #fff8e9;

    text-shadow:
        0 2px 3px rgba(0,0,0,.6);

    transform:
        rotateZ(-1deg);

    font-family:
        Tahoma,
        Arial,
        sans-serif;
}


/* main sign */

.door-sign .main {

    display: block;

    font-size:
        clamp(
            19px,
            5.2vw,
            27px
        );

    font-weight: 800;

    line-height: 1.3;
}


/* second sign */

.door-sign .sub {

    display: block;

    margin-top: 7px;

    font-size:
        clamp(
            11px,
            3vw,
            15px
        );

    line-height: 1.45;

    font-weight: 600;
}


/* =========================================================
   HANDLE
========================================================= */

.handle {

    position: absolute;

    z-index: 8;

    right: 12%;

    top: 54%;

    width: 13px;

    height: 13px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 30%,
            #fff1b2,
            #b88739 42%,
            #51361b 100%
        );

    box-shadow:
        2px 3px 4px
        rgba(0,0,0,.4);
}


/* =========================================================
   EITAA DOOR
========================================================= */

.eitaa-door .door-surface {

    background:
        linear-gradient(
            90deg,
            #69472d,
            #8b6040 20%,
            #6d482d 48%,
            #8d6040 75%,
            #54351f
        );
}

.eitaa-door .door-sign {

    color:
        #fff4dd;
}


/* =========================================================
   WHATSAPP DOOR
========================================================= */

.whatsapp-door .door-surface {

    background:
        linear-gradient(
            90deg,
            #68482e,
            #946640 18%,
            #754f31 50%,
            #a16f45 75%,
            #604029
        );
}

.whatsapp-door .door-sign {

    color:
        #fffdf0;
}


/* =========================================================
   ROOM BEHIND EITAA
========================================================= */

.eitaa-room {

    position: absolute;

    inset: 0;

    z-index: 1;

    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            #25231f,
            #171716 70%,
            #0e0e0d
        );
}


/* wall */

.eitaa-room::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.03),
            transparent 30%,
            rgba(255,255,255,.02)
        );
}


/* floor */

.room-floor {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 27%;

    background:
        repeating-linear-gradient(
            90deg,
            #3a322a 0 25px,
            #2d2822 25px 50px
        );

    transform:
        perspective(300px)
        rotateX(18deg);

    transform-origin:
        bottom;
}


/* broken furniture */

.box {

    position: absolute;

    background:
        #4b3828;

    border:
        1px solid
        rgba(255,255,255,.05);

    box-shadow:
        3px 5px 8px
        rgba(0,0,0,.5);
}

.box.b1 {
    width: 30%;
    height: 15%;
    left: 9%;
    bottom: 25%;
    transform: rotate(-4deg);
}

.box.b2 {
    width: 22%;
    height: 13%;
    right: 10%;
    bottom: 24%;
    transform: rotate(7deg);
}

.box.b3 {
    width: 14%;
    height: 9%;
    right: 30%;
    bottom: 32%;
    transform: rotate(-9deg);
}


/* hanging lamp */

.room-lamp {

    position: absolute;

    left: 50%;

    top: 2%;

    transform:
        translateX(-50%);

    width: 6px;

    height: 20%;

    background:
        #111;
}

.room-lamp::after {

    content: "";

    position: absolute;

    left: 50%;

    bottom: -16px;

    transform:
        translateX(-50%);

    width: 38px;

    height: 23px;

    border-radius:
        50% 50% 10% 10%;

    background:
        #4d4031;

    box-shadow:
        0 4px 8px rgba(0,0,0,.7);
}


/* flickering light */

.room-light {

    position: absolute;

    left: 50%;

    top: 17%;

    transform:
        translateX(-50%);

    width: 150px;

    height: 150px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,207,111,.42),
            rgba(255,207,111,.13) 35%,
            rgba(255,207,111,0) 70%
        );

    filter: blur(3px);

    animation:
        flicker 2.8s
        infinite;
}

@keyframes flicker {

    0% {
        opacity: .85;
    }

    8% {
        opacity: .25;
    }

    12% {
        opacity: .8;
    }

    28% {
        opacity: .9;
    }

    31% {
        opacity: .12;
    }

    35% {
        opacity: .72;
    }

    63% {
        opacity: .8;
    }

    66% {
        opacity: .18;
    }

    69% {
        opacity: .9;
    }

    100% {
        opacity: .8;
    }
}


/* =========================================================
   GARDEN BEHIND WHATSAPP
========================================================= */

.whatsapp-garden {

    position: absolute;

    inset: 0;

    z-index: 1;

    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            #86b7d2 0%,
            #d6e9d1 50%,
            #78945a 51%,
            #4f693b 100%
        );
}


/* garden sun */

.garden-sun {

    position: absolute;

    width: 95px;
    height: 95px;

    border-radius: 50%;

    top: 8%;
    right: 12%;

    background:
        radial-gradient(
            circle,
            #fff8cb,
            #f5dc7e 55%,
            rgba(245,220,126,0) 70%
        );

    opacity: .85;
}


/* garden grass */

.garden-grass {

    position: absolute;

    bottom: 0;

    left: 0;
    right: 0;

    height: 44%;

    background:
        linear-gradient(
            180deg,
            #7da15c,
            #4c6a3a
        );
}


/* garden path */

.garden-path {

    position: absolute;

    bottom: -10%;

    left: 50%;

    transform:
        translateX(-50%);

    width: 38%;

    height: 65%;

    clip-path:
        polygon(
            37% 0,
            63% 0,
            100% 100%,
            0 100%
        );

    background:
        linear-gradient(
            90deg,
            #bda27b,
            #dfc89d,
            #bda27b
        );
}


/* garden tree */

.garden-tree {

    position: absolute;

    bottom: 30%;

    width: 13px;
    height: 80px;

    background:
        #63452d;
}

.garden-tree::before {

    content: "";

    position: absolute;

    width: 85px;
    height: 85px;

    left: 50%;
    top: -55px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background:
        #52784a;

    box-shadow:
        30px 7px 0 #628653,
        -27px 12px 0 #456b43;
}

.garden-tree.gt1 {
    left: 10%;
}

.garden-tree.gt2 {
    right: 11%;

    transform:
        scale(.85);
}


/* flowers */

.garden-flower {

    position: absolute;

    bottom: 23%;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        #fff3c4;

    box-shadow:
        0 0 8px rgba(255,255,255,.35);
}


/* =========================================================
   OPENING STATES
========================================================= */

.scene.open-eitaa
.eitaa-door .door {

    transform:
        rotateY(-115deg);
}

.scene.open-whatsapp
.whatsapp-door .door {

    transform:
        rotateY(-115deg);
}


/*
   وقتی یکی باز می‌شود،
   دیگری کمی تاریک می‌شود.
*/

.scene.open-eitaa
.whatsapp-door {

    filter:
        brightness(.65);
}

.scene.open-whatsapp
.eitaa-door {

    filter:
        brightness(.65);
}


/* =========================================================
   FOOTER
========================================================= */

.bottom-note {

    position: relative;

    z-index: 20;

    flex: 0 0 auto;

    margin-top: 5px;

    font-size: 9px;

    color:
        rgba(0,0,0,.45);

    user-select: none;
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-height: 680px) {

    .headline {
        margin-top: 7px;
    }

    .scene {
        margin-top: 5px;
    }

    .doors {
        bottom: 6%;
        height: 69%;
    }

    .door-frame {
        height: 84%;
    }

    .door-sign .main {
        font-size: 18px;
    }

    .door-sign .sub {
        font-size: 10px;
    }
}


/* =========================================================
   VERY NARROW PHONES
========================================================= */

@media (max-width: 340px) {

    .page {
        padding-left: 9px;
        padding-right: 9px;
    }

    .headline {
        font-size: 17px;
    }

    .doors {
        width: 98%;
    }

    .door-sign .main {
        font-size: 16px;
    }

    .door-sign .sub {
        font-size: 9px;
    }
}


/* =========================================================
   LANDSCAPE
========================================================= */

@media (
    orientation: landscape
) and (
    max-height: 520px
) {

    .page {
        padding-top:
            max(
                8px,
                env(safe-area-inset-top)
            );
    }

    .brand-name {
        font-size: 17px;
    }

    .headline {
        font-size: 15px;
        margin-top: 3px;
    }

    .scene {
        margin-top: 3px;
    }

    .doors {
        width: 75%;
        height: 82%;
        bottom: 4%;
    }

    .door-frame {
        height: 90%;
    }

    .door-sign .main {
        font-size: 15px;
    }

    .door-sign .sub {
        font-size: 9px;
    }

    .bottom-note {
        display: none;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (
    prefers-reduced-motion: reduce
) {

    .door {
        transition: none;
    }

    .room-light {
        animation: none;
    }
}

</style>
</head>


<body>


<div class="page">


    <!-- =====================================================
         BRAND
    ====================================================== -->

    <header class="brand">

        <div class="brand-name">
            Rosha Support
        </div>

    </header>



    <!-- =====================================================
         HEADLINE
    ====================================================== -->

    <h1 class="headline">
        برای ارتباط مستقیم یکی را انتخاب نمایید
    </h1>



    <!-- =====================================================
         MAIN SCENE
    ====================================================== -->

    <main
        id="scene"
        class="scene">


        <div class="sky"></div>

        <div class="cloud one"></div>
        <div class="cloud two"></div>

        <div class="hill back"></div>
        <div class="hill"></div>

        <div class="ground"></div>
        <div class="path"></div>

        <div class="tree t1"></div>
        <div class="tree t2"></div>
        <div class="tree t3"></div>
        <div class="tree t4"></div>

        <div class="flower f1"></div>
        <div class="flower f2"></div>
        <div class="flower f3"></div>
        <div class="flower f4"></div>



        <!-- =================================================
             EITAA ROOM
        ================================================== -->

        <div class="eitaa-room">

            <div class="room-lamp"></div>

            <div class="room-light"></div>

            <div class="box b1"></div>
            <div class="box b2"></div>
            <div class="box b3"></div>

            <div class="room-floor"></div>

        </div>



        <!-- =================================================
             WHATSAPP GARDEN
        ================================================== -->

        <div class="whatsapp-garden">

            <div class="garden-sun"></div>

            <div class="garden-grass"></div>

            <div class="garden-path"></div>

            <div class="garden-tree gt1"></div>
            <div class="garden-tree gt2"></div>

            <div
                class="garden-flower"
                style="left:18%;">

            </div>

            <div
                class="garden-flower"
                style="right:20%;">

            </div>

            <div
                class="garden-flower"
                style="left:31%;">

            </div>

        </div>



        <!-- =================================================
             DOORS
        ================================================== -->

        <div class="doors">


            <!-- =============================================
                 EITAA
            ============================================== -->

            <div
                class="door-unit eitaa-door"
                id="eitaaUnit">

                <div class="door-frame">

                    <div
                        class="door"
                        id="eitaaDoor">

                        <div class="door-surface">


                            <div class="panel p1"></div>
                            <div class="panel p2"></div>
                            <div class="panel p3"></div>


                            <div class="door-sign">

                                <span class="main">
                                    برخط
                                </span>

                                <span class="sub">
                                    پس از ورود فیلترشکن خود را خاموش کنید

            <!-- =============================================
                 WHATSAPP
            ============================================== -->

            <div
                class="door-unit whatsapp-door"
                id="whatsappUnit">

                <div class="door-frame">

                    <div
                        class="door"
                        id="whatsappDoor">

                        <div class="door-surface">


                            <div class="panel p1"></div>
                            <div class="panel p2"></div>
                            <div class="panel p3"></div>


                            <div class="door-sign">

                                <span class="main">

        Rosha Support
    </div>


</div>



<script>

/* =========================================================
   
   =========================================================
   
                    ROSHA SUPPORT SETTINGS
   
   فقط این قسمت را برای تغییر مقصدها تغییر بده.
   
   =========================================================
   ========================================================= */


/*
 * شماره واتساپ
 *
 * بدون + و بدون فاصله
 */

const ROSHA_SETTINGS = {

    whatsappNumber:
        "989304047332",


    /*
     * آیدی ایتا
     *
     * بدون @
     */

    eitaaUsername:
        "RoshaSupportt",


    /*
     * پیام آماده واتساپ
     */

    whatsappMessage:
        "سلام، برای دریافت اطلاعات بیشتر پیام دادم."

};



/* =========================================================
   ELEMENTS
========================================================= */

const scene =
    document.getElementById("scene");

const whatsappDoor =
    document.getElementById("whatsappDoor");

const eitaaDoor =
    document.getElementById("eitaaDoor");



/* =========================================================
   LINKS
========================================================= */

const whatsappLink =
    "https://wa.me/" +
    ROSHA_SETTINGS.whatsappNumber +
    "?text=" +
    encodeURIComponent(
        ROSHA_SETTINGS.whatsappMessage
    );


const eitaaLink =
    "https://eitaa.com/" +
    ROSHA_SETTINGS.eitaaUsername;



/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext = null;


/*
 * ساخت AudioContext فقط بعد از لمس کاربر
 */

function getAudioContext() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return null;
        }

        if (!audioContext) {
            audioContext =
                new AudioContext();
        }

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();
        }

        return audioContext;

    } catch (error) {

        return null;
    }
}



/* =========================================================
   DOOR CLICK SOUND
========================================================= */

function playDoorSound() {

    const ctx =
        getAudioContext();

    if (!ctx) {
        return;
    }


    try {

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.setValueAtTime(
            220,
            ctx.currentTime
        );


        oscillator.frequency.exponentialRampToValueAtTime(
            120,
            ctx.currentTime + .18
        );


        gain.gain.setValueAtTime(
            .0001,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .11,
            ctx.currentTime + .015
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + .20
        );


        oscillator.connect(gain);

        gain.connect(
            ctx.destination
        );


        oscillator.start();

        oscillator.stop(
            ctx.currentTime + .21
        );

    } catch (error) {

    }
}



/* =========================================================
   WHATSAPP BIRD SOUND
========================================================= */

function playBirdSound() {

    const ctx =
        getAudioContext();

    if (!ctx) {
        return;
    }


    try {

        const now =
            ctx.currentTime;


        /*
         * Bird chirp 1
         */

        createBirdChirp(
            ctx,
            now + .05,
            1250
        );


        /*
         * Bird chirp 2
         */

        createBirdChirp(
            ctx,
            now + .22,
            1650
        );


        /*
         * Bird chirp 3
         */

        createBirdChirp(
            ctx,
            now + .43,
            1400
        );


    } catch (error) {

    }
}


function createBirdChirp(
    ctx,
    start,
    frequency
) {

    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    oscillator.type =
        "sine";


    oscillator.frequency.setValueAtTime(
        frequency,
        start
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        frequency * 1.28,
        start + .07
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        frequency * .9,
        start + .13
    );


    gain.gain.setValueAtTime(
        .0001,
        start
    );


    gain.gain.exponentialRampToValueAtTime(
        .055,
        start + .015
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        start + .14
    );


    oscillator.connect(gain);

    gain.connect(
        ctx.destination
    );


    oscillator.start(start);

    oscillator.stop(
        start + .15
    );
}



/* =========================================================
   EITAA ROOM SOUND
========================================================= */

function playRoomSound() {

    const ctx =
        getAudioContext();

    if (!ctx) {
        return;
    }


    try {

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.setValueAtTime(
            72,
            ctx.currentTime
        );


        gain.gain.setValueAtTime(
            .0001,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .025,
            ctx.currentTime + .04
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + .35
        );


        oscillator.connect(gain);

        gain.connect(
            ctx.destination
        );


        oscillator.start();

        oscillator.stop(
            ctx.currentTime + .36
        );

    } catch (error) {

    }
}



/* =========================================================
   NAVIGATION
========================================================= */

let navigating = false;


function openWhatsApp() {

    if (navigating) {
        return;
    }

    navigating = true;


    getAudioContext();

    playDoorSound();


    scene.classList.add(
        "open-whatsapp"
    );


    /*
     * بعد از باز شدن در،
     * صدای باغ/پرنده پخش می‌شود.
     */

    setTimeout(
        playBirdSound,
        500
    );


    /*
     * سپس واتساپ
     */

    setTimeout(
        function() {

            window.location.href =
                whatsappLink;

        },
        950
    );
}



function openEitaa() {

    if (navigating) {
        return;
    }

    navigating = true;


    getAudioContext();

    playDoorSound();


    scene.classList.add(
        "open-eitaa"
    );


    setTimeout(
        playRoomSound,
        430
    );


    /*
     * سپس ایتا
     */

    setTimeout(
        function() {

            window.location.href =
                eitaaLink;

        },
        950
    );
}



/* =========================================================
   TOUCH EVENTS
========================================================= */

whatsappDoor.addEventListener(
    "pointerup",
    function(event) {

        event.preventDefault();

        openWhatsApp();

    }
);


eitaaDoor.addEventListener(
    "pointerup",
    function(event) {

        event.preventDefault();

        openEitaa();

    }
);


/* =========================================================
   PREVENT UNWANTED GESTURES
========================================================= */

document.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);

</script>

</body>
