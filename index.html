<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   viewport-fit=cover">

    <meta name="theme-color" content="#111111">

    <meta name="description"
          content="Rosha Support">

    <title>Rosha Support</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100svh;
            height: 100dvh;

            font-family:
                Tahoma,
                Arial,
                "Segoe UI",
                sans-serif;

            background-image:
                url("./background.png");

            background-size: cover;

            /*
             * تصویر از قسمت بالاتر قرار می‌گیرد
             * چون پایین تصویر شلوغ‌تر است.
             */

            background-position:
                center top;

            background-repeat: no-repeat;

            position: relative;

            color: #111111;

            -webkit-font-smoothing: antialiased;

            text-rendering: optimizeLegibility;
        }



        /* =====================================================
           OVERLAY
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.03) 0%,
                    rgba(255,255,255,0.01) 45%,
                    rgba(0,0,0,0.08) 100%
                );
        }



        /* =====================================================
           MAIN PAGE
        ===================================================== */

        .page {

            position: relative;

            z-index: 1;

            width: 100%;

            height: 100dvh;

            min-height: 100svh;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding-top:
                max(
                    24px,
                    env(safe-area-inset-top)
                );

            padding-left: 20px;

            padding-right: 20px;

            padding-bottom:
                max(
                    12px,
                    env(safe-area-inset-bottom)
                );
        }



        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            margin-top: 4px;

            margin-bottom: 0;

            user-select: none;
        }


        .brand-name {

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            font-size:
                clamp(
                    22px,
                    6vw,
                    30px
                );

            font-weight: 600;

            letter-spacing: 0.5px;

            color: rgba(
                0,
                0,
                0,
                0.88
            );

            text-shadow:
                0 1px 1px
                rgba(255,255,255,0.35);
        }



        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .content {

            width: 100%;

            max-width: 470px;

            display: flex;

            flex-direction: column;

            align-items: center;

            /*
             * عمداً در بالای تصویر قرار گرفته
             */

            margin-top:
                clamp(
                    28px,
                    7vh,
                    70px
                );

            text-align: center;
        }



        /* =====================================================
           HEADLINE
        ===================================================== */

        .headline {

            width: 100%;

            font-size:
                clamp(
                    20px,
                    5.5vw,
                    28px
                );

            line-height: 1.7;

            font-weight: 700;

            color: #111111;

            text-shadow:
                0 1px 1px
                rgba(255,255,255,0.55);

            margin: 0;

            white-space: nowrap;
        }



        /* =====================================================
           BUTTON AREA
        ===================================================== */

        .buttons {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap:
                clamp(
                    22px,
                    4vh,
                    32px
                );

            margin-top:
                clamp(
                    30px,
                    5vh,
                    45px
                );
        }



        /* =====================================================
           EACH OPTION
        ===================================================== */

        .option {

            width: min(
                100%,
                360px
            );

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }



        /* =====================================================
           MAIN BUTTON
        ===================================================== */

        .contact-button {

            width: 100%;

            height:
                clamp(
                    62px,
                    16vw,
                    76px
                );

            border-radius: 19px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            /*
             * رنگ پایه توسط کلاس اختصاصی
             */

            color: #ffffff;

            font-size:
                clamp(
                    18px,
                    5vw,
                    23px
                );

            font-weight: 700;

            letter-spacing: 0;

            /*
             * لایه‌های سه‌بعدی
             */

            border: 1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.45
                );

            box-shadow:
                0 10px 0 rgba(0,0,0,0.20),
                0 17px 28px rgba(0,0,0,0.28),
                inset 0 2px 0 rgba(255,255,255,0.38),
                inset 0 -4px 0 rgba(0,0,0,0.12);

            transform:
                translateY(0);

            transition:
                transform 0.10s ease,
                box-shadow 0.10s ease,
                filter 0.10s ease;
        }



        /* =====================================================
           BUTTON HIGHLIGHT
        ===================================================== */

        .contact-button::before {

            content: "";

            position: absolute;

            top: 2px;

            left: 5%;

            width: 90%;

            height: 43%;

            border-radius: 50%;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.32),
                    rgba(255,255,255,0)
                );

            pointer-events: none;
        }



        .contact-button::after {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: inherit;

            box-shadow:
                inset 0 0 0 1px
                rgba(255,255,255,0.12);

            pointer-events: none;
        }



        .contact-button span {

            position: relative;

            z-index: 2;

            text-shadow:
                0 2px 3px
                rgba(0,0,0,0.22);
        }



        /* =====================================================
           WHATSAPP
        ===================================================== */

        .whatsapp-button {

            background:
                linear-gradient(
                    180deg,
                    #35e875 0%,
                    #25D366 45%,
                    #16b957 100%
                );

            box-shadow:
                0 10px 0 #109c48,
                0 17px 28px rgba(0,0,0,0.28),
                inset 0 2px 0 rgba(255,255,255,0.42),
                inset 0 -4px 0 rgba(0,0,0,0.13);
        }



        /* =====================================================
           EITAA
        ===================================================== */

        .eitaa-button {

            background:
                linear-gradient(
                    180deg,
                    #ff9a54 0%,
                    #ff7e26 45%,
                    #e96512 100%
                );

            box-shadow:
                0 10px 0 #c8540d,
                0 17px 28px rgba(0,0,0,0.28),
                inset 0 2px 0 rgba(255,255,255,0.42),
                inset 0 -4px 0 rgba(0,0,0,0.13);
        }



        /* =====================================================
           PRESS ANIMATION
        ===================================================== */

        .contact-button:active {

            transform:
                translateY(8px);

            filter:
                brightness(0.96);

            box-shadow:
                0 2px 0 rgba(0,0,0,0.20),
                0 7px 13px rgba(0,0,0,0.25),
                inset 0 2px 0 rgba(255,255,255,0.25),
                inset 0 -2px 0 rgba(0,0,0,0.12);
        }



        /* =====================================================
           LABEL UNDER BUTTON
        ===================================================== */

        .label {

            margin-top: 9px;

            font-size:
                clamp(
                    19px,
                    5.2vw,
                    25px
                );

            line-height: 1.4;

            font-weight: 800;

            color: #000000;

            text-shadow:
                0 1px 2px
                rgba(255,255,255,0.65);

            user-select: none;
        }



        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media (max-height: 680px) {

            .content {

                margin-top: 20px;
            }

            .headline {

                font-size: 19px;
            }

            .buttons {

                margin-top: 20px;

                gap: 17px;
            }

            .contact-button {

                height: 57px;

                font-size: 18px;
            }

            .label {

                font-size: 18px;

                margin-top: 5px;
            }
        }



        /* =====================================================
           VERY NARROW PHONES
        ===================================================== */

        @media (max-width: 340px) {

            .page {

                padding-left: 14px;

                padding-right: 14px;
            }

            .headline {

                font-size: 18px;
            }

            .contact-button {

                height: 55px;

                font-size: 17px;
            }

            .label {

                font-size: 18px;
            }
        }



        /* =====================================================
           LANDSCAPE
        ===================================================== */

        @media (
            orientation: landscape
        ) and (
            max-height: 520px
        ) {

            .page {

                padding-top:
                    max(
                        10px,
                        env(safe-area-inset-top)
                    );
            }

            .brand-name {

                font-size: 18px;
            }

            .content {

                margin-top: 12px;
            }

            .headline {

                font-size: 16px;
            }

            .buttons {

                flex-direction: row;

                justify-content: center;

                gap: 15px;

                margin-top: 15px;
            }

            .option {

                width: 45%;
            }

            .contact-button {

                height: 52px;

                font-size: 16px;
            }

            .label {

                font-size: 17px;

                margin-top: 4px;
            }
        }



        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (
            prefers-reduced-motion: reduce
        ) {

            .contact-button {

                transition: none;
            }
        }

    </style>

</head>


<body>


    <div class="page">


        <!-- =================================================
             BRAND
        ================================================== -->

        <header class="brand">

            <div class="brand-name">
                Rosha Support
            </div>

        </header>



        <!-- =================================================
             MAIN
        ================================================== -->

        <main class="content">


            <h1 class="headline">
                برای ارتباط مستقیم یکی را انتخاب نمایید
            </h1>



            <!-- =============================================
                 BUTTONS
            ============================================== -->

            <div class="buttons">


                <!-- =========================================
                     WHATSAPP
                ========================================== -->

                <div class="option">

                    <a
                        id="whatsappButton"
                        class="contact-button whatsapp-button"
                        href="#"
                        aria-label="شروع گفتگو">

                        <span>
                            شروع گفتگو
                        </span>

                    </a>

                    <div class="label">
                        واتساب
                    </div>

                </div>



                <!-- =========================================
                     EITAA
                ========================================== -->

                <div class="option">

                    <a
                        id="eitaaButton"
                        class="contact-button eitaa-button"
                        href="#"
                        aria-label="شروع گفتگو">

                        <span>
                            شروع گفتگو
                        </span>

                    </a>

                    <div class="label">
                        ایتا
                    </div>

                </div>


            </div>


        </main>


    </div>



    <script>


        /* =====================================================
           
           =====================================================
           
                    ROSHA SUPPORT SETTINGS
           
           این قسمت را برای تغییر اطلاعات تماس استفاده کن.
           
           فقط این سه مقدار را تغییر بده.
           
           =====================================================
           ===================================================== */


        const ROSHA_SETTINGS = {


            /*
             * شماره واتساپ
             *
             * بدون + و بدون فاصله
             *
             * مثال:
             *
             * 989304047332
             */

            whatsappNumber:
                "989304047332",



            /*
             * آیدی ایتا
             *
             * بدون @
             *
             * مثال:
             *
             * RoshaSupportt
             */

            eitaaUsername:
                "RoshaSupportt",



            /*
             * پیام آماده واتساپ
             *
             * در صورت نیاز این متن را تغییر بده.
             */

            whatsappMessage:
                "سلام، برای دریافت اطلاعات بیشتر پیام دادم."

        };



        /* =====================================================
           WHATSAPP LINK
        ===================================================== */

        const whatsappLink =

            "https://wa.me/" +

            ROSHA_SETTINGS.whatsappNumber +

            "?text=" +

            encodeURIComponent(
                ROSHA_SETTINGS.whatsappMessage
            );



        /* =====================================================
           EITAA LINK
        ===================================================== */

        const eitaaLink =

            "https://eitaa.com/" +

            ROSHA_SETTINGS.eitaaUsername;



        /* =====================================================
           SET LINKS
        ===================================================== */

        const whatsappButton =
            document.getElementById(
                "whatsappButton"
            );


        const eitaaButton =
            document.getElementById(
                "eitaaButton"
            );


        whatsappButton.href =
            whatsappLink;


        eitaaButton.href =
            eitaaLink;



        /* =====================================================
           PREMIUM CLICK SOUND
           
           Web Audio API
           
           هیچ فایل صوتی خارجی استفاده نمی‌شود.
        ===================================================== */

        let audioContext = null;



        function playClickSound() {

            try {


                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;


                if (!AudioContext) {

                    return;
                }


                if (!audioContext) {

                    audioContext =
                        new AudioContext();
                }


                if (
                    audioContext.state ===
                    "suspended"
                ) {

                    audioContext.resume();
                }



                const oscillator =
                    audioContext.createOscillator();


                const gain =
                    audioContext.createGain();



                /*
                 * صدای کوتاه و واضح
                 */

                oscillator.type =
                    "sine";


                oscillator.frequency.setValueAtTime(
                    720,
                    audioContext.currentTime
                );


                oscillator.frequency.exponentialRampToValueAtTime(
                    470,
                    audioContext.currentTime + 0.075
                );



                /*
                 * ولوم
                 */

                gain.gain.setValueAtTime(
                    0.0001,
                    audioContext.currentTime
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.075,
                    audioContext.currentTime + 0.008
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    audioContext.currentTime + 0.085
                );



                oscillator.connect(
                    gain
                );


                gain.connect(
                    audioContext.destination
                );


                oscillator.start();


                oscillator.stop(
                    audioContext.currentTime +
                    0.09
                );


            } catch (error) {

                /*
                 * اگر دستگاه اجازه پخش صدا نداد،
                 * لینک همچنان بدون مشکل کار می‌کند.
                 */

            }

        }



        /* =====================================================
           TOUCH SOUND
        ===================================================== */

        whatsappButton.addEventListener(
            "pointerdown",
            playClickSound,
            {
                passive: true
            }
        );


        eitaaButton.addEventListener(
            "pointerdown",
            playClickSound,
            {
                passive: true
            }
        );



    </script>


</body>
</html>
