<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#111111">

<title>ارتباط مستقیم</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    font-family:
        Tahoma,
        Arial,
        "Segoe UI",
        sans-serif;

    background: #111;
}

body {
    color: #111;
    touch-action: manipulation;
}


/* =========================================================
   MAIN PAGE
========================================================= */

.page {
    position: relative;

    width: 100%;

    height: 100vh;
    height: 100svh;
    height: 100dvh;

    overflow: hidden;

    background-image: url("./background.png");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}


/* =========================================================
   MAIN INSTRUCTION
========================================================= */

.instruction {

    position: absolute;

    z-index: 20;

    /*
       بالاتر از قبل قرار گرفته
    */
    top: 6.2%;

    left: 50%;

    transform: translateX(-50%);

    width: 96%;

    text-align: center;

    white-space: nowrap;

    color: #111;

    /*
       نوشته بزرگ‌تر و خواناتر
    */
    font-size: clamp(
        23px,
        6.2vw,
        34px
    );

    font-weight: 900;

    line-height: 1.35;

    letter-spacing: -0.4px;

    text-shadow:
        0 1px 0 rgba(255,255,255,0.95),
        0 2px 4px rgba(0,0,0,0.16);

    pointer-events: none;
}


/* =========================================================
   CONTACT BUTTON AREA

   دکمه‌ها بالاتر از نوشته‌های
   «برخط» و «آنلاین» داخل تصویر قرار می‌گیرند.
========================================================= */

.contact-area {

    position: absolute;

    z-index: 30;

    /*
       انتقال دکمه‌ها به بالاتر
    */
    top: 13.8%;

    left: 0;

    width: 100%;

    display: flex;

    flex-direction: row;

    justify-content: space-between;

    align-items: flex-start;

    direction: ltr;

    padding-left: 11.2%;
    padding-right: 11.2%;

    pointer-events: none;
}


/* =========================================================
   CONTACT BUTTON
========================================================= */

.contact-button {

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 37.8vw;

    max-width: 176px;

    height: 72px;

    border-radius: 15px;

    border: 1px solid rgba(255,255,255,0.72);

    text-decoration: none;

    overflow: hidden;

    cursor: pointer;

    pointer-events: auto;

    user-select: none;
    -webkit-user-select: none;

    transform: translate3d(0,0,0);

    transition:
        transform 80ms ease,
        box-shadow 80ms ease,
        filter 80ms ease;

    backdrop-filter:
        blur(13px)
        saturate(145%);

    -webkit-backdrop-filter:
        blur(13px)
        saturate(145%);
}


/* =========================================================
   GLASS HIGHLIGHT
========================================================= */

.contact-button::before {

    content: "";

    position: absolute;

    inset: 1px;

    border-radius: 14px;

    pointer-events: none;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.48) 0%,
            rgba(255,255,255,0.15) 28%,
            rgba(255,255,255,0.03) 58%,
            rgba(0,0,0,0.13) 100%
        );
}


/* =========================================================
   TOP LIGHT REFLECTION
========================================================= */

.contact-button::after {

    content: "";

    position: absolute;

    top: 0;

    left: 10%;

    width: 80%;

    height: 2px;

    border-radius: 100%;

    background:
        rgba(255,255,255,0.78);

    box-shadow:
        0 1px 4px rgba(255,255,255,0.35);

    pointer-events: none;
}


/* =========================================================
   WHATSAPP
========================================================= */

.whatsapp {

    background:
        linear-gradient(
            145deg,
            rgba(52,232,124,0.94),
            rgba(37,211,102,0.96) 48%,
            rgba(18,166,82,0.97)
        );

    box-shadow:

        0 15px 25px
        rgba(0,0,0,0.34),

        0 7px 10px
        rgba(0,0,0,0.23),

        inset 0 3px 3px
        rgba(255,255,255,0.55),

        inset 0 -7px 10px
        rgba(0,0,0,0.18);
}


/* =========================================================
   EITAA
========================================================= */

.eitaa {

    background:
        linear-gradient(
            145deg,
            rgba(255,171,75,0.96),
            rgba(245,130,32,0.97) 48%,
            rgba(211,91,9,0.98)
        );

    box-shadow:

        0 15px 25px
        rgba(0,0,0,0.34),

        0 7px 10px
        rgba(0,0,0,0.23),

        inset 0 3px 3px
        rgba(255,255,255,0.55),

        inset 0 -7px 10px
        rgba(0,0,0,0.18);
}


/* =========================================================
   BUTTON TEXT
========================================================= */

.button-name {

    position: relative;

    z-index: 5;

    color: #fff;

    font-size:
        clamp(
            23px,
            6vw,
            31px
        );

    font-weight: 900;

    line-height: 1;

    text-shadow:

        0 2px 2px
        rgba(0,0,0,0.30),

        0 3px 6px
        rgba(0,0,0,0.24);
}


/* =========================================================
   PRESS EFFECT

   فقط خود دکمه فرو می‌رود.
   تصویر ثابت باقی می‌ماند.
========================================================= */

.contact-button:active {

    transform:
        translate3d(0,5px,0)
        scale(0.985);

    filter: brightness(0.93);

    box-shadow:

        0 4px 7px
        rgba(0,0,0,0.30),

        0 2px 3px
        rgba(0,0,0,0.18),

        inset 0 6px 10px
        rgba(0,0,0,0.23),

        inset 0 -1px 2px
        rgba(255,255,255,0.18);
}


/* =========================================================
   SMALL HEIGHT PHONES
========================================================= */

@media (max-height: 700px) {

    .instruction {
        top: 5%;
        font-size: 21px;
    }

    .contact-area {
        top: 12.5%;
    }

    .contact-button {
        height: 65px;
    }

    .button-name {
        font-size: 21px;
    }
}


/* =========================================================
   VERY NARROW PHONES
========================================================= */

@media (max-width: 340px) {

    .instruction {
        font-size: 20px;
    }

    .contact-area {
        padding-left: 9%;
        padding-right: 9%;
        top: 13%;
    }

    .contact-button {
        width: 39vw;
        height: 64px;
    }

    .button-name {
        font-size: 20px;
    }
}


/* =========================================================
   LANDSCAPE
========================================================= */

@media (orientation: landscape) {

    .instruction {
        top: 4%;
        font-size: 20px;
    }

    .contact-area {
        top: 12%;
    }

    .contact-button {
        height: 60px;
    }
}

</style>

</head>


<body>

<main class="page">


    <!-- =====================================================
         متن بالای دو دکمه
    ====================================================== -->

    <div class="instruction">
        برای ارتباط مستقیم، یکی را انتخاب کنید
    </div>


    <!-- =====================================================
         دکمه‌ها
         
         چپ = ایتا
         راست = واتساپ
    ====================================================== -->

    <section
        class="contact-area"
        aria-label="انتخاب پیام‌رسان"
    >


        <!-- ایتا -->

        <a
            id="eitaaButton"
            class="contact-button eitaa"
            href="#"
            aria-label="ایتا"
        >

            <span class="button-name">
                ایتا
            </span>

        </a>


        <!-- واتساپ -->

        <a
            id="whatsappButton"
            class="contact-button whatsapp"
            href="#"
            aria-label="واتساپ"
        >

            <span class="button-name">
                واتساپ
            </span>

        </a>


    </section>

</main>


<script>

/* =========================================================
   =========================================================
   تنظیمات قابل تغییر
   =========================================================

   اگر بعداً خواستی شماره یا آیدی را تغییر بدهی،
   فقط همین قسمت را تغییر بده.

========================================================= */

const CONTACT_SETTINGS = {

    /* شماره واتساپ بدون + و بدون فاصله */

    whatsappNumber:
        "989304047332",


    /* پیام آماده واتساپ */

    whatsappMessage:
        "سلام، برای ارتباط مستقیم پیام دادم.",


    /* آیدی ایتا بدون @ */

    eitaaUsername:
        "RoshaSupportt"

};


/* =========================================================
   WHATSAPP LINK
========================================================= */

const whatsappButton =
    document.getElementById(
        "whatsappButton"
    );

whatsappButton.href =
    "https://wa.me/" +
    CONTACT_SETTINGS.whatsappNumber +
    "?text=" +
    encodeURIComponent(
        CONTACT_SETTINGS.whatsappMessage
    );


/* =========================================================
   EITAA LINK
========================================================= */

const eitaaButton =
    document.getElementById(
        "eitaaButton"
    );

eitaaButton.href =
    "https://eitaa.com/" +
    CONTACT_SETTINGS.eitaaUsername;


/* =========================================================
   SIMPLE BEEP
   صدای بسیار کوتاه و ساده
========================================================= */

let audioContext = null;


function getAudioContext() {

    try {

        if (!audioContext) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) {
                return null;
            }

            audioContext =
                new AudioContext();
        }

        if (
            audioContext.state ===
            "suspended"
        ) {
            audioContext.resume();
        }

        return audioContext;

    } catch (error) {

        return null;
    }
}


/* =========================================================
   بیپ کوتاه
========================================================= */

function playBeep() {

    const ctx =
        getAudioContext();

    if (!ctx) {
        return;
    }

    const now =
        ctx.currentTime;


    const oscillator =
        ctx.createOscillator();


    const gain =
        ctx.createGain();


    oscillator.type =
        "sine";


    oscillator.frequency.setValueAtTime(
        880,
        now
    );


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.12,
        now + 0.008
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.10
    );


    oscillator.connect(gain);

    gain.connect(
        ctx.destination
    );


    oscillator.start(now);

    oscillator.stop(
        now + 0.11
    );
}


/* =========================================================
   TOUCH / CLICK SOUND
========================================================= */

whatsappButton.addEventListener(
    "pointerdown",
    function () {

        playBeep();

    },
    {
        passive: true
    }
);


eitaaButton.addEventListener(
    "pointerdown",
    function () {

        playBeep();

    },
    {
        passive: true
    }
);


/* =========================================================
   PULL TO REFRESH
=========================================================

   صفحه همچنان Scroll نمی‌شود،
   اما اگر کاربر از بالای صفحه به سمت پایین بکشد،
   صفحه Refresh می‌شود.

   این کار بدون ایجاد Scroll واقعی انجام می‌شود.
========================================================= */

let touchStartY = 0;

let touchStartX = 0;

let refreshing = false;


document.addEventListener(
    "touchstart",
    function (event) {

        if (
            event.touches &&
            event.touches.length === 1
        ) {

            touchStartY =
                event.touches[0].clientY;

            touchStartX =
                event.touches[0].clientX;
        }

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    function (event) {

        if (refreshing) {
            return;
        }

        if (
            !event.changedTouches ||
            event.changedTouches.length !== 1
        ) {
            return;
        }


        const endY =
            event.changedTouches[0].clientY;


        const endX =
            event.changedTouches[0].clientX;


        const distanceY =
            endY - touchStartY;


        const distanceX =
            Math.abs(
                endX - touchStartX
            );


        /*
           فقط حرکت عمودی قابل توجه
           به سمت پایین باعث Refresh می‌شود.
        */

        if (
            touchStartY < 90 &&
            distanceY > 95 &&
            distanceY > distanceX * 1.4
        ) {

            refreshing = true;

            window.location.reload();
        }

    },
    {
        passive: true
    }
);

</script>

</body>

</html>
